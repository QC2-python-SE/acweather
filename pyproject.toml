[project]
name = "acweather"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hendrikkuehne", email = "hendrik.kuehne2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
acweather = "acweather:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
]
